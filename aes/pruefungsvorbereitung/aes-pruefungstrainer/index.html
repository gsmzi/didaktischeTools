<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AES-Prüfungstrainer</title>
<meta name="description" content="Übungen zur Realschulabschlussprüfung im Fach AES: Etiketten, Fälle, Grafiken und Wissen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1b7a5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AES-Trainer">

<style>:root{--bg:#f4f6f3;--card:#fff;--ink:#1c2520;--muted:#57635c;--line:#d5dcd6;--accent:#1b7a5a;--accent-soft:#e2f1ea;--ok:#1e7a3c;--ok-soft:#e5f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;--warn-soft:#fff5e0;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--surface:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131815;--card:#1c231f;--ink:#e6ebe7;--muted:#9eaaa2;--line:#343f38;--accent:#62c9a2;--accent-soft:#1f3a2f;--ok:#6fcf8f;--ok-soft:#1d3426;--bad:#f2968e;--bad-soft:#3d2120;--warn-soft:#3a3018;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--surface:#1c231f}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:14px 16px 4px;max-width:1040px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd .btn{flex:none;min-height:38px;padding:5px 10px;font-size:.88rem}
.hd .btn.on{background:var(--accent-soft)}
header h1{margin:0;font-size:1.35rem}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
main{max-width:1040px;margin:0 auto;padding:0 16px 32px}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 4px;border-radius:9px;cursor:pointer;font:inherit;font-size:.84rem;line-height:1.2;min-height:48px;min-width:0;overflow-wrap:anywhere}
nav.tabs button b{display:block;font-size:1.15rem;font-weight:400}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button.on,:root:not([data-theme="light"]) .btn:not(.sec){color:#0e1a14}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.levels button{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 4px;cursor:pointer;min-height:44px;font-size:.9rem;line-height:1.2}
.levels button small{display:block;color:var(--muted);font-size:.74rem}
.levels button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chips::-webkit-scrollbar{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;margin:4px 0;-webkit-overflow-scrolling:touch}
.chips button{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{margin:0 0 8px;font-size:1.08rem}
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.work>*{min-width:0}
.work .card{margin-bottom:0}
@media (min-width:800px){.work.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.work.two .stim{position:sticky;top:8px;max-height:calc(100vh - 16px)}}
.stim{overflow:auto;-webkit-overflow-scrolling:touch}
@media (max-width:799px){.work.two .stim{max-height:38vh;position:sticky;top:4px;z-index:2;box-shadow:0 3px 10px rgba(0,0,0,.18)}}
@media (max-width:600px){header{padding-top:8px}header h1{font-size:1.1rem}header p{display:none}nav.tabs{margin:6px 0}nav.tabs button{min-height:44px;font-size:.78rem;padding:4px 2px}nav.tabs button b{font-size:.95rem}.levels{margin:6px 0}.levels button{min-height:38px;padding:3px}.levels button small{display:none}.score{margin:0 0 5px;font-size:.8rem}.card{padding:11px}.front{min-height:0}}
.q{font-size:1.04rem;font-weight:600;margin:0 0 8px}
.sub{font-size:.88rem;color:var(--muted);margin:0 0 8px}
.opts{display:grid;gap:7px;margin:8px 0;grid-template-columns:minmax(0,1fr)}
.opt{font:inherit;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:9px 11px;border-radius:9px;cursor:pointer;min-height:44px;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.row{border-top:1px solid var(--line);padding:8px 0}
.row:first-child{border-top:0}
.row p{margin:0 0 5px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{font:inherit;font-size:.88rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer;min-height:38px}
.seg button.sel{border-color:var(--accent);background:var(--accent-soft)}
.seg button.right{border-color:var(--ok);background:var(--ok-soft)}
input[type=text],textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:92px;resize:vertical}
.numin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.numin input{width:9em}
.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;min-height:44px}
.btn.sec{background:var(--card);color:var(--accent)}
.btn.warn{background:var(--card);color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;display:none;overflow-wrap:anywhere}
.fb.ok{display:block;background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{display:block;background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.tip{display:block;background:var(--warn-soft);border-left:4px solid #c98a00}
.score{font-size:.85rem;color:var(--muted);margin:2px 0 8px}
.small{font-size:.88rem;color:var(--muted)}
details{margin:4px 0}
details summary{cursor:pointer;color:var(--accent);min-height:30px}
.case{background:var(--accent-soft);border-radius:9px;padding:10px 12px;margin:0}
.case b{display:block;margin-bottom:2px}
.seq{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:44px;padding:6px;border:1px dashed var(--line);border-radius:9px}
.seq span{background:var(--accent-soft);border-radius:7px;padding:4px 8px;font-size:.9rem}
.seal{display:inline-block;vertical-align:middle}
.sealbig{display:flex;justify-content:center;margin:6px 0 10px}
.sealbig svg{width:150px;height:auto;max-height:150px}
/* Packung */
.pack{display:grid;grid-template-columns:minmax(0,132px) minmax(0,1fr);gap:10px}
.front{color:#fff;border-radius:10px;padding:9px;min-height:230px;display:flex;flex-direction:column;gap:5px;background:var(--pc,#555);text-align:center}
.front .br{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.front .nm{font-weight:800;font-size:1rem;line-height:1.12;overflow-wrap:anywhere}
.front .pic{font-size:2.2rem;line-height:1.15}
.front .cl{background:#fff;color:#1c2520;border-radius:7px;font-size:.72rem;font-weight:700;padding:2px 5px;line-height:1.2}
.front .sz{margin-top:auto;font-size:.76rem;font-weight:700}
.front .sl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.front .sl svg{height:38px;width:auto;max-width:100%;background:#fff;border-radius:4px}
.back{font-size:.83rem;line-height:1.35;min-width:0}
.back p{margin:0 0 5px}
.back table{border-collapse:collapse;width:100%;margin:3px 0 5px;font-size:.8rem}
.back td{border-top:1px solid var(--line);padding:1px 3px}
.back td:last-child{text-align:right;white-space:nowrap}
/* Grafik */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink);font:12px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.chart .ax{fill:var(--muted);font-size:11px}
.legend{display:grid;gap:3px;margin:6px 0 0;padding:0;list-style:none;font-size:.9rem}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:13px;height:13px;border-radius:4px;flex:none}
.legend b{margin-left:auto;font-weight:600}
table.st{border-collapse:collapse;width:100%;font-size:.92rem}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
table.st td:last-child,table.st th:last-child{text-align:right;white-space:nowrap}
.barmini{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
.barmini i{display:block;height:100%;background:var(--accent)}
footer{max-width:1040px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:.8rem}
</style></head>
<body>
<header><div class="hd"><div><h1>AES-Prüfungstrainer</h1><p>Realschulabschluss Baden-Württemberg · Schwerpunkte 2027</p></div><button class="btn sec" id="standbtn">🎯 Stand</button></div></header>
<main>
<nav class="tabs" aria-label="Bereich"></nav>
<div id="train">
  <div class="levels" role="group" aria-label="Stufe"></div>
  <div class="chips" id="chips"></div>
  <div class="score" id="score"></div>
  <div class="work" id="work">
    <section class="card stim" id="stim" hidden></section>
    <section class="card" id="qcard">
      <div id="qa"></div>
      <div class="btns">
        <button class="btn" id="check">Prüfen</button>
        <button class="btn sec" id="tip">Tipp</button>
        <button class="btn sec" id="next">Neue Aufgabe</button>
        <button class="btn sec" id="solve" hidden>Lösung zeigen</button>
      </div>
      <div class="fb" id="fb" role="status"></div>
    </section>
  </div>
  <section class="card" style="margin-top:12px"><details><summary>Begriffe und Prüfungsformat</summary><div id="terms"></div></details></section>
</div>
<div id="stand" hidden></div>
</main>
<footer>Alle Marken, Produkte und Zahlen in den Aufgaben sind erfunden. Siegel sind vereinfacht nachgezeichnet und dienen nur dem Lernen. Der Fortschritt bleibt auf diesem Gerät.</footer>
<script>
'use strict';
/* ---------- Hilfen ---------- */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const fmt = (x, d = 2) => x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const euro = x => fmt(x, Number.isInteger(x) ? 0 : 2) + ' €';
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };

/* ---------- Siegel: vereinfacht nachgezeichnet. mask=true verdeckt den Schriftzug ---------- */
const F = 'font-family="Arial,Helvetica,sans-serif"';

  : `<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="middle" fill="${fill}" ${F} ${extra}>${t}</text>`;
const star = (x, y, r, rot = 0) => { let p = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, q = i % 2 ? r * .4 : r; p += `${(x + q * Math.cos(a)).toFixed(1)},${(y + q * Math.sin(a)).toFixed(1)} `; } return `<polygon points="${p.trim()}" fill="#fff"/>`; };

  eubio: m => SVG(100, 67, `<rect width="100" height="67" rx="2" fill="#78b833"/><rect x="2" y="2" width="96" height="63" rx="1" fill="none" stroke="#fff" stroke-width="1.2"/>` + [[19, 36], [25, 22], [36, 13], [50, 10], [65, 11], [79, 13], [90, 11], [83, 25], [75, 38], [64, 48], [49, 53], [33, 51]].map(p => star(p[0], p[1], 4.3)).join('') + `<path d="M12 54C28 42 46 33 67 27" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>`, 'EU-Bio-Siegel', m),

  bioland: m => SVG(100, 74, `<rect width="100" height="74" rx="4" fill="#007a3d"/><rect x="3.5" y="3.5" width="93" height="67" rx="2.5" fill="none" stroke="#fff" stroke-width="1.6"/>` + (m ? `<rect x="16" y="10" width="68" height="16" rx="2" fill="#fff" opacity=".65"/>` : `<text x="50" y="24" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" ${FS}>Bioland</text>`) + `<ellipse cx="50" cy="49" rx="32" ry="17" fill="#007a3d" stroke="#fff" stroke-width="1.8"/><path d="M22 52Q50 38 78 52M25 57Q50 44 75 57M31 62Q50 51 69 62" stroke="#8ec641" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="50" cy="39" r="3.2" fill="#fff"/>`, 'Bioland', m),
  demeter: m => SVG(100, 56, `<rect width="100" height="56" rx="2" fill="#fff"/><rect x="2" y="2" width="96" height="52" fill="#e86c1f"/><path d="M2 54V45C24 38 56 42 98 42V54Z" fill="#005a32"/>` + (m ? `<rect x="14" y="13" width="72" height="19" rx="2" fill="#fff" opacity=".65"/>` : `<text x="50" y="31" font-size="22" font-weight="800" text-anchor="middle" fill="#fff" ${F} letter-spacing=".5">demeter</text>`), 'Demeter', m),
  naturland: m => SVG(96, 96, `<rect width="96" height="96" rx="5" fill="#fff" stroke="#006b38" stroke-width="2"/><rect x="5" y="5" width="86" height="86" rx="3" fill="#007d40"/><path d="M12 24Q38 14 68 22M12 34Q38 24 62 31M12 44Q34 36 52 40" stroke="#8ec641" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M5 64C34 46 62 42 91 44V67C62 65 34 71 5 84Z" fill="#fff"/><path d="M36 84Q62 74 86 78" stroke="#8ec641" stroke-width="2.4" fill="none" stroke-linecap="round"/>` + (m ? `<rect x="18" y="52" width="60" height="13" rx="2" fill="#006b38" opacity=".6"/>` : `<text x="49" y="63" font-size="15.5" font-weight="700" font-style="italic" text-anchor="middle" fill="#006b38" ${FS} transform="rotate(-11 49 60)">Naturland</text>`), 'Naturland', m),

  fairtrade: m => SVG(86, 100, `<rect width="86" height="100" rx="6" fill="#111"/><circle cx="43" cy="42" r="32" fill="#111" stroke="#fff" stroke-width="2"/><path d="M43 12A30 30 0 0 0 15 53C24 55 34 52 41 43C31 32 33 19 43 12Z" fill="#009fe3"/><path d="M71 31A30 30 0 0 1 31 70C46 66 53 53 45 41C53 35 63 34 71 31Z" fill="#8ec641"/><circle cx="43" cy="34" r="6.5" fill="#111"/><path d="M22 25C30 31 36 39 43 43C38 52 33 62 28 70" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/>` + TX(m, 43, 92, 12.5, 'FAIRTRADE'), 'Fairtrade', m),

}

}

  return `<div class="chart"><h2>${th.t}</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balkendiagramm: ${th.t}">${s}</svg><p class="small">Beispieldaten, nur zum Üben.</p></div>`;

function lineSVG(th, v) {

function series(from, to, n) { const st = (to - from) / (n - 1); const v = []; for (let i = 0; i < n; i++) v.push(Math.round((from + st * i + (i && i < n - 1 ? rnd(-1, 1) : 0)) / 5) * 5); for (let i = 1; i < n; i++) if (to > from ? v[i] <= v[i - 1] : v[i] >= v[i - 1]) v[i] = v[i - 1] + (to > from ? 5 : -5); return v.map(x => Math.max(5, x)); }

    if (open) return fb('tip', `Es ${open === 1 ? 'fehlt noch 1 Eintrag' : `fehlen noch ${open} Einträge`}.`);
    let g = 0; while (g < q.items.length && q.mix[q.seq[g]] === q.items[g]) g++;
    if (g === q.items.length) { count(true); return finish('Richtig!'); }
    count(false); return fb('bad', g ? `Die ersten ${g} ${g === 1 ? 'Stelle stimmt' : 'Stellen stimmen'}, danach nicht mehr.` : 'Schon die erste Stelle stimmt nicht.');
  }
  if (!q.shown) { if ($('#free').value.trim().length < 12) return fb('tip', 'Schreibe zuerst deine Antwort auf, hier oder auf Papier.'); return reveal(); }
  const n = q.set.size, ok = n >= q.need; count(ok);
  t.e = ''; if (ok) return finish(`Sehr gut: ${n} von ${q.need} geforderten Punkten.`);
  t.done = true; $('#check').disabled = true; $('#pts').querySelectorAll('.opt').forEach(b => { b.disabled = true; });
  fb('tip', `Du hast ${n} von ${q.need} geforderten Punkten. ${t.card ? 'Die Karte kommt bald wieder.' : 'Vergleiche deine Antwort mit den Punkten oben.'}`); $('#tip').disabled = true; $('#next').className = 'btn'; if (APP.mode === 'sprint' && APP.sprint.i >= ROUND) $('#next').textContent = 'Ergebnis ansehen';
}
function solve() {
  const t = APP.task, q = t.q; let s = '';
  if (q.k === 'one' || q.k === 'multi') { $('#qa').querySelectorAll('.opt').forEach((b, i) => { b.classList.remove('sel'); if (q.opts[i].ok) b.classList.add('right'); }); s = 'Die richtige Lösung ist markiert.'; }
  if (q.k === 'num') s = `Lösung: ${fmt(q.ans, Number.isInteger(q.ans) ? 0 : 2)} ${q.unit}.`;
  if (q.k === 'assign') { $('#qa').querySelectorAll('.row').forEach((r, i) => r.querySelectorAll('button').forEach((b, j) => { b.classList.remove('sel'); if (q.rows[i].c === j) b.classList.add('right'); })); s = 'Die richtige Zuordnung ist markiert.'; }
  if (q.k === 'order') { s = 'Richtige Reihenfolge: ' + q.items.join(' → '); }
  finish(s + ' Dafür gibt es keinen Punkt, aber du kannst daraus lernen.');
}

/* Aufbau */
function newTask() {
  if (APP.mode === 'sprint' && APP.sprint && APP.sprint.i >= ROUND && APP.task && APP.task.done && !APP.summary) { APP.summary = true; return sprintEnd(); }
  APP.summary = false;
  APP.task = null; unlockCheck();
  APP.task = GEN[APP.mode](APP.level); const t = APP.task;
  $('#fb').className = 'fb'; $('#solve').hidden = true; $('#tip').disabled = false; $('#check').hidden = false; $('#tip').hidden = false;
  const n = $('#next'); n.className = 'btn sec'; n.textContent = APP.mode === 'sprint' ? 'Nächste Karte' : 'Neue Aufgabe';
  const st = $('#stim'), has = !!t.stim; st.hidden = !has; st.innerHTML = has ? t.stim : ''; st.scrollTop = 0; $('#work').className = 'work' + (has ? ' two' : '');
  renderQ(); unlockCheck(); showScore();
}
function sprintEnd() {
  const s = APP.sprint; $('#qa').innerHTML = `<p class="q">Runde geschafft!</p><p>${s.ok} von ${ROUND} Karten hast du im ersten Versuch richtig. Unsichere Karten kommen in der nächsten Runde öfter dran.</p>`;
  $('#check').hidden = true; $('#tip').hidden = true; $('#solve').hidden = true; $('#fb').className = 'fb'; $('#next').textContent = 'Nächste Runde'; $('#next').className = 'btn';
  $('#stim').hidden = true; $('#work').className = 'work'; APP.task = null; APP.sprint = null; showScore();
}
function showScore() {
  const el = $('#score');
  if (APP.mode === 'sprint') { el.textContent = APP.sprint ? `Karte ${APP.sprint.i} von ${ROUND} · ${APP.sprint.ok} richtig im ersten Versuch` : ''; return; }
  const s = DATA.stat[APP.mode] || { n: 0, r: 0 }; el.textContent = s.n ? `Im ersten Versuch richtig: ${s.r} von ${s.n}` : 'Punkte zählen nur beim ersten Versuch.';
}
function drawLevels() {
  const hints = LEVELHINT[APP.mode] || [];
  $('.levels').innerHTML = LEVELS.map((l, i) => `<button data-l="${l[0]}" class="${APP.level === l[0] ? 'on' : ''}">${l[0][0].toUpperCase() + l[0].slice(1)}<small>${hints[i] || ''}</small></button>`).join('');
  $('.levels').querySelectorAll('button').forEach(b => b.onclick = () => { APP.level = DATA.level = b.dataset.l; save(); APP.sprint = null; drawLevels(); newTask(); });
}
function drawChips() {
  const c = $('#chips'), src = APP.mode === 'fall' ? AREA : APP.mode === 'schreiben' ? WAREA : APP.mode === 'sprint' ? Object.assign({ alle: 'Alle Themen' }, TOPIC) : null;
  c.hidden = !src; if (!src) return;
  c.innerHTML = Object.keys(src).map(k => `<button data-k="${k}" class="${APP.area[APP.mode] === k ? 'on' : ''}">${src[k]}</button>`).join('');
  c.querySelectorAll('button').forEach(b => b.onclick = () => { APP.area[APP.mode] = b.dataset.k; APP.sprint = null; drawChips(); newTask(); });
}
const TERMS = {
  etikett: `<p><b>Pflichtangaben:</b> Bezeichnung, Zutatenliste mit Allergenen, Nährwerttabelle, Mindesthaltbarkeitsdatum, Nettofüllmenge, Hersteller mit Anschrift.</p><p><b>Grundpreis:</b> Preis pro Kilogramm oder Liter, damit man Packungen vergleichen kann.</p><p><b>Nutri-Score:</b> Bewertung von A bis E, gedacht für den Vergleich innerhalb einer Produktgruppe.</p>`,
  fall: `<p><b>Gesetzlich:</b> Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung.</p><p><b>Freiwillig:</b> Privathaftpflicht, Hausrat, Berufsunfähigkeit, private Unfallversicherung.</p><p><b>Warmmiete:</b> Kaltmiete plus Nebenkosten.</p>`,
  grafik: `<p><b>Kernaussage:</b> das Wichtigste der Grafik in einem Satz, möglichst mit einem Wert.</p><p><b>Zusammenhang:</b> Formuliere mit „je … desto“.</p><p><b>Begründung:</b> steht nicht in der Grafik, sondern kommt aus deinem Wissen.</p>`,
  schreiben: `<p><b>Punkte:</b> Meist gibt es einen Punkt pro Aspekt. Was bei „Erläutere“ nur genannt ist, zählt in diesen Übungen höchstens halb. Echte Bewertungen können davon abweichen.</p><p><b>Antwort bauen:</b> Aussage, Begründung, Beispiel.</p><p><b>Am Produkt:</b> Schreibe zuerst selbst, am besten in ganzen Sätzen auf Papier. Hake danach ehrlich ab, was du hattest.</p>`,
  sprint: `<p>Eine Runde hat ${ROUND} Karten. Was du noch nicht sicher kannst, kommt häufiger wieder. Bei Karten zum Selbstformulieren hakst du deine Punkte selbst ab.</p>`
};
const FORMAT = `<h2 style="margin-top:12px">Prüfungsformat</h2><p>90 Minuten, 50 Punkte. Pflichtteil A: vier Aufgaben mit je 8 Punkten. Wahlteil B: eine von zwei Aufgaben mit 18 Punkten. Das sind rund 1,8 Minuten pro Punkt. Stand: Ausführungsbestimmungen 2026/27. Ältere Prüfungen haben andere Punktzahlen.</p><h2>Operatoren</h2><table class="st"><tr><td><b>Nenne</b></td><td style="text-align:left;white-space:normal">Stichwort oder kurzer Satz, ohne Erklärung</td></tr><tr><td><b>Beschreibe</b></td><td style="text-align:left;white-space:normal">in ganzen Sätzen darstellen, wie etwas ist</td></tr><tr><td><b>Erkläre</b></td><td style="text-align:left;white-space:normal">Bedeutung oder Ursache verständlich machen</td></tr><tr><td><b>Erläutere</b></td><td style="text-align:left;white-space:normal">erklären und mit einem Beispiel oder Grund ergänzen</td></tr><tr><td><b>Begründe</b></td><td style="text-align:left;white-space:normal">Aussage mit Argumenten stützen</td></tr><tr><td><b>Bewerte</b></td><td style="text-align:left;white-space:normal">eigenes Urteil fällen und begründen</td></tr><tr><td><b>Arbeite heraus</b></td><td style="text-align:left;white-space:normal">Informationen aus Text, Tabelle oder Grafik entnehmen</td></tr></table><p class="small">Merke: Meist gibt es einen Punkt pro Aspekt. Zähle, wie viele Aspekte gefragt sind.</p>`;
function setMode(m) {
  APP.mode = m;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); $('#standbtn').classList.toggle('on', m === 'stand');
  const st = m === 'stand'; $('#train').hidden = st; $('#stand').hidden = !st;
  if (st) return drawStand();
  $('#terms').innerHTML = TERMS[m] + FORMAT; APP.lastKey = ''; APP.sprint = null; APP.summary = false;
  drawLevels(); drawChips(); newTask();
}
const LABEL = Object.assign({ etikett: 'Etiketten-Detektiv', fall: 'Fall-Trainer', grafik: 'Grafik-Check', schreiben: 'Schreiben' }, TOPIC);
function drawStand() {
  const row = k => { const s = DATA.stat[k]; if (!s || !s.n) return `<tr><td>${LABEL[k]}</td><td class="small">noch nichts geübt</td></tr>`; const p = Math.round(s.r / s.n * 100); return `<tr><td>${LABEL[k]}<div class="barmini"><i style="width:${p}%"></i></div></td><td>${s.r} von ${s.n}</td></tr>`; };
  const done = CARDS.filter(c => (DATA.box[c.id] || 0) >= 3).length;
  const weak = Object.keys(TOPIC).filter(k => DATA.stat[k] && DATA.stat[k].n >= 3).sort((a, b) => DATA.stat[a].r / DATA.stat[a].n - DATA.stat[b].r / DATA.stat[b].n)[0];
  $('#stand').innerHTML = `<section class="card"><h2>Dein Stand</h2><p>${done} von ${CARDS.length} Karten sitzen schon gut.${weak ? ` Üben lohnt sich gerade bei <b>${TOPIC[weak]}</b>.` : ''}</p><table class="st"><tr><th>Bereich</th><th>Erster Versuch richtig</th></tr>${['etikett', 'fall', 'grafik', 'schreiben'].map(row).join('')}</table><h2 style="margin-top:14px">Sprint nach Themen</h2><table class="st">${Object.keys(TOPIC).map(row).join('')}</table></section>
  <section class="card"><h2>Auf ein anderes Gerät übertragen</h2><p class="small">Der Stand wird nur auf diesem Gerät gespeichert. Erzeuge hier einen Code und füge ihn auf dem anderen Gerät ein. Die beiden Stände werden zusammengeführt.</p><div class="btns"><button class="btn sec" id="exp">Code erzeugen und kopieren</button></div><textarea id="code" placeholder="Code hier einfügen" aria-label="Fortschrittscode" style="margin-top:8px"></textarea><div class="btns"><button class="btn sec" id="imp">Code übernehmen</button></div><div class="fb" id="sfb"></div></section>
  <section class="card"><h2>Als App installieren</h2><p class="small"><b>iPhone und iPad:</b> In Safari auf „Teilen“ tippen, dann „Zum Home-Bildschirm“. <b>Windows:</b> In Edge oder Chrome im Menü „App installieren“ wählen. Danach funktioniert der Trainer auch ohne Internet.</p></section>
  <section class="card"><details><summary>Stand zurücksetzen</summary><p class="small">Das löscht den gesamten Fortschritt auf diesem Gerät.</p><button class="btn warn" id="reset">Alles löschen</button></details></section>`;
  const say = (c, h) => { const f = $('#sfb'); f.className = 'fb ' + c; f.innerHTML = h; };
  $('#exp').onclick = async () => { const c = 'AES1.' + btoa(unescape(encodeURIComponent(JSON.stringify({ stat: DATA.stat, box: DATA.box })))); $('#code').value = c; try { await navigator.clipboard.writeText(c); say('ok', 'Der Code ist kopiert.'); } catch (e) { $('#code').select(); say('tip', 'Bitte kopiere den Code aus dem Feld.'); } };
  $('#imp').onclick = () => {
    const c = $('#code').value.trim(); if (!c) return say('tip', 'Füge zuerst einen Code ein.');
    try { if (!c.startsWith('AES1.')) throw 0; const d = JSON.parse(decodeURIComponent(escape(atob(c.slice(5))))); for (const k in d.stat) { const a = DATA.stat[k]; if (!a || d.stat[k].n > a.n) DATA.stat[k] = d.stat[k]; } for (const k in d.box) DATA.box[k] = Math.max(DATA.box[k] || 0, d.box[k]); save(); drawStand(); say('ok', 'Der Stand wurde übernommen.'); } catch (e) { say('bad', 'Dieser Code ist nicht gültig.'); }
  };
  $('#reset').onclick = () => { if (confirm('Wirklich den gesamten Fortschritt auf diesem Gerät löschen?')) { DATA.stat = {}; DATA.box = {}; save(); drawStand(); } };
}
load(); APP.level = DATA.level || 'leicht';
$('nav.tabs').innerHTML = TABS.map(t => `<button data-m="${t[0]}"><b aria-hidden="true">${t[1]}</b>${t[2]}</button>`).join('');
$('nav.tabs').querySelectorAll('button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('#standbtn').onclick = () => setMode('stand');
$('#check').onclick = check; $('#next').onclick = newTask; $('#solve').onclick = solve;
$('#tip').onclick = () => { if (APP.task) fb('tip', APP.task.tip || 'Lies die Aufgabe noch einmal genau.'); };
setMode('etikett');
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
